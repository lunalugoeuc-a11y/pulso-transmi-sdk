name: pulso-transmi-select-champion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/select-champion.yml"
      - "src/pulso_transmi/champion.py"
      - "src/pulso_transmi/store.py"

concurrency:
  group: pulso-transmi-select-champion
  cancel-in-progress: false

jobs:
  compare-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -e .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Compare official cycles and promote only under guardrails
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SELECTION_SUMMARY_PATH: champion-selection-summary.txt
        run: |
          set -o pipefail
          python -m pulso_transmi.champion | tee champion-selection.log
      - name: Publish selection result
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          encoded="$(base64 -w0 champion-selection-summary.txt | tr '+/' '-_' | tr -d '=')"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="pulso-transmi/selection/${encoded}" \
            -f description='champion selection complete'
