*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18304b;font-family:system-ui,sans-serif}

aside p,aside li{font-size:14px;line-height:1.55}aside ul{padding-left:18px}aside code{font-size:12px;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;border-bottom:1px solid #e4ebf3;padding:8px 3px;overflow-wrap:anywhere}

<script>
const model={"entities": [{"n": "corridors", "title": "Corredores", "g": 0, "r": 0, "base": false, "fields": [["corridor_id", "PK", "uuid"], ["name", "UQ", "texto"]], "note": "Catálogo propuesto a partir de los nombres de corredor de la API."}, {"n": "stations", "title": "Estaciones", "g": 0, "r": 1, "base": true, "fields": [["station_id", "PK", "texto"], ["corridor_id", "FK", "uuid"], ["station_name", "", "texto"], ["latitude", "", "decimal"], ["longitude", "", "decimal"]], "note": "Datos del catálogo existente; corridor se normaliza como FK. El ID conserva ceros iniciales."}, {"n": "observations", "title": "Demanda observada", "g": 0, "r": 2, "base": true, "fields": [["snapshot_id", "PK · FK", "uuid"], ["station_id", "PK · FK", "texto"], ["observed_at", "PK · FK", "timestamptz"], ["demand", "", "entero"]], "note": "PK (snapshot_id, station_id, observed_at). Una fila por estación e instante dentro de cada corte inmutable."}, {"n": "dataset_snapshots", "title": "Cortes de datos", "g": 1, "r": 0, "base": false, "fields": [["snapshot_id", "PK", "uuid"], ["run_id", "FK", "uuid"], ["dataset_version", "", "texto"], ["cutoff_at", "", "timestamptz"], ["captured_at", "", "timestamptz"], ["manifest_uri", "", "texto"], ["manifest_sha256", "UQ", "texto"]], "note": "Manifiesto inmutable con hashes y URIs de observaciones, contexto y catálogo original. Cada corte permite reconstruir sus datos."}, {"n": "context_records", "title": "Clima y eventos", "g": 1, "r": 1, "base": true, "fields": [["snapshot_id", "PK · FK", "uuid"], ["observed_at", "PK", "timestamptz"], ["rain_mm", "", "decimal"], ["rain_forecast", "", "decimal"], ["temperature_c", "", "decimal"], ["temperature_forecast", "", "decimal"], ["event_intensity", "", "decimal"]], "note": "PK (snapshot_id, observed_at). Contexto compartido por las estaciones de un mismo corte e instante."}, {"n": "ingestion_checkpoints", "title": "Estado de ingesta", "g": 1, "r": 2, "base": false, "fields": [["checkpoint_id", "PK", "uuid"], ["run_id", "FK", "uuid"], ["stream", "", "texto"], ["scope_key", "", "texto"], ["cursor_value", "?", "texto"], ["last_seen_at", "?", "timestamptz"], ["committed_at", "", "timestamptz"]], "note": "Historial de checkpoints confirmados por endpoint y filtros. UQ (run_id, stream, scope_key). No se avanza al fallar la persistencia."}, {"n": "feature_sets", "title": "Versiones de variables", "g": 2, "r": 0, "base": false, "fields": [["feature_set_id", "PK", "uuid"], ["name", "", "texto"], ["version", "", "texto"], ["definition_uri", "", "texto"], ["definition_sha256", "UQ", "texto"], ["git_commit", "", "texto"]], "note": "Definición versionada de variables y transformaciones. UQ (name, version); no contiene valores futuros calculados sobre toda la historia."}, {"n": "experiments", "title": "Experimentos", "g": 2, "r": 1, "base": false, "fields": [["experiment_id", "PK", "uuid"], ["snapshot_id", "FK", "uuid"], ["feature_set_id", "FK", "uuid"], ["run_id", "FK", "uuid"], ["train_start / train_end", "", "timestamptz"], ["valid_start / valid_end", "", "timestamptz"], ["parameters", "", "json"], ["results_uri", "?", "texto"]], "note": "Cada registro representa una configuración y una ventana de backtesting. Los resultados enlazan un informe reproducible."}, {"n": "model_versions", "title": "Versiones de modelo", "g": 2, "r": 2, "base": false, "fields": [["model_version_id", "PK", "uuid"], ["experiment_id", "FK", "uuid"], ["name / version", "", "texto"], ["artifact_uri", "", "texto"], ["artifact_sha256", "UQ", "texto"], ["created_at", "", "timestamptz"], ["status", "", "texto"]], "note": "Artefacto inmutable derivado de un experimento. UQ (name, version); la versión usada se fija en cada lote de predicción."}, {"n": "pipeline_runs", "title": "Ejecuciones", "g": 3, "r": 0, "base": false, "fields": [["run_id", "PK", "uuid"], ["external_run_id", "UQ", "texto"], ["trigger_type", "", "texto"], ["git_commit", "", "texto"], ["started_at", "", "timestamptz"], ["finished_at", "?", "timestamptz"], ["status", "", "texto"], ["error_detail", "?", "texto"]], "note": "Una ejecución de pipeline, incluida la identificación del intento externo. Registra fallos aunque no produzca datos ni modelos."}, {"n": "forecast_batches", "title": "Lotes de predicción", "g": 3, "r": 1, "base": false, "fields": [["batch_id", "PK", "uuid"], ["run_id", "FK", "uuid"], ["model_version_id", "FK", "uuid"], ["snapshot_id", "FK", "uuid"], ["issued_at", "", "timestamptz"], ["origin_at", "", "timestamptz"], ["mode", "", "texto"]], "note": "Fija modelo, datos y origen del pronóstico. mode distingue backtest y operación; issued_at es el momento de creación real."}, {"n": "forecasts", "title": "Predicciones", "g": 3, "r": 2, "base": false, "fields": [["forecast_id", "PK", "uuid"], ["batch_id", "FK", "uuid"], ["station_id", "FK", "texto"], ["target_at", "", "timestamptz"], ["horizon_minutes", "", "entero"], ["predicted_demand", "", "decimal"]], "note": "UQ (batch_id, station_id, target_at). Un lote puede incluir varias estaciones y horizontes. Horizonte relativo a origin_at."}, {"n": "monitoring_events", "title": "Monitoreo y decisiones", "g": 4, "r": 0, "base": false, "fields": [["event_id", "PK", "uuid"], ["run_id", "FK", "uuid"], ["snapshot_id", "FK", "uuid"], ["reference_snapshot_id", "FK · ?", "uuid"], ["model_version_id", "FK · ?", "uuid"], ["station_id", "FK · ?", "texto"], ["event_type / detected_at", "", "texto / timestamptz"], ["evidence / action", "", "json / texto"]], "note": "Calidad, drift y decisiones de conservar/reentrenar. evidence guarda método, ventanas, umbrales y resultados; sin modelo para alertas de ingesta."}, {"n": "evaluations", "title": "Evaluaciones", "g": 4, "r": 1, "base": false, "fields": [["evaluation_id", "PK", "uuid"], ["forecast_id", "FK", "uuid"], ["actual_snapshot_id", "FK", "uuid"], ["station_id", "FK", "texto"], ["target_at", "FK", "timestamptz"], ["absolute_error", "", "decimal"], ["evaluated_at", "", "timestamptz"]], "note": "UQ (forecast_id, actual_snapshot_id). Une una predicción a una observación exacta; permite reevaluar contra revisiones de datos."}, {"n": "submissions", "title": "Envíos y respuestas", "g": 4, "r": 2, "base": false, "fields": [["submission_id", "PK", "uuid"], ["batch_id", "FK", "uuid"], ["run_id", "FK", "uuid"], ["attempt_no", "", "entero"], ["idempotency_key", "", "texto"], ["sent_at", "", "timestamptz"], ["status", "", "texto"], ["remote_id", "?", "texto"], ["response_detail", "?", "json"]], "note": "Un registro por intento. UQ (batch_id, attempt_no). Contrato propuesto pendiente de la API competitiva; no contiene credenciales."}], "edges": [["corridors", "stations", "corridor_id", "1", "0..N"], ["stations", "observations", "station_id", "1", "0..N"], ["dataset_snapshots", "context_records", "snapshot_id", "1", "0..N"], ["context_records", "observations", "(snapshot_id, observed_at)", "1", "0..N"], ["pipeline_runs", "dataset_snapshots", "run_id", "1", "0..N"], ["pipeline_runs", "ingestion_checkpoints", "run_id", "1", "0..N"], ["dataset_snapshots", "experiments", "snapshot_id", "1", "0..N"], ["feature_sets", "experiments", "feature_set_id", "1", "0..N"], ["pipeline_runs", "experiments", "run_id", "1", "0..N"], ["experiments", "model_versions", "experiment_id", "1", "0..N"], ["pipeline_runs", "forecast_batches", "run_id", "1", "0..N"], ["model_versions", "forecast_batches", "model_version_id", "1", "0..N"], ["dataset_snapshots", "forecast_batches", "snapshot_id", "1", "0..N"], ["forecast_batches", "forecasts", "batch_id", "1", "0..N"], ["stations", "forecasts", "station_id", "1", "0..N"], ["pipeline_runs", "monitoring_events", "run_id", "1", "0..N"], ["dataset_snapshots", "monitoring_events", "snapshot_id", "1", "0..N"], ["dataset_snapshots", "monitoring_events", "reference_snapshot_id", "0..1", "0..N"], ["model_versions", "monitoring_events", "model_version_id", "0..1", "0..N"], ["stations", "monitoring_events", "station_id", "0..1", "0..N"], ["forecasts", "evaluations", "(forecast_id, station_id, target_at)", "1", "0..N"], ["observations", "evaluations", "(actual_snapshot_id, station_id, target_at)", "1", "0..N"], ["forecast_batches", "submissions", "batch_id", "1", "0..N"], ["pipeline_runs", "submissions", "run_id", "1", "0..N"]]};
const panel=document.getElementById('details');
const diagram=document.querySelector('.canvas svg');
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function select(name){
 const entity=model.entities.find(e=>e.n===name);
 document.querySelectorAll('.entity').forEach(e=>{e.classList.toggle('dim',!!name&&e.dataset.entity!==name&&!model.edges.some(r=>(r[0]===name&&r[1]===e.dataset.entity)||(r[1]===name&&r[0]===e.dataset.entity)));e.classList.toggle('selected',e.dataset.entity===name)});
 document.querySelectorAll('.relation').forEach(e=>{const active=!!name&&(e.dataset.source===name||e.dataset.target===name);e.classList.toggle('active',active);e.classList.toggle('dim',!!name&&!active)});
 panel.replaceChildren();
 if(!entity){panel.append(element('h2','15 entidades · 5 dominios'),element('p','Modelo lógico propuesto para operar el reto MLOps completo. Las tres entidades basadas en la API se distinguen de las nuevas.'),element('p','Selecciona una tabla en el esquema. Los conectores relacionados se resaltan y aquí aparecen sus claves, tipos y cardinalidades.'),element('p','PK: clave primaria. FK: clave foránea. ?: campo opcional. R01–R24: referencias del registro de relaciones.'));return}
 panel.append(element('h2',entity.title),element('code',entity.n),element('p',entity.note));
 const t=element('table');const tr=element('tr');['Campo','Clave','Tipo'].forEach(v=>tr.append(element('th',v)));t.append(tr);
 entity.fields.forEach(f=>{const r=element('tr');[f[0],f[1]||'—',f[2]].forEach(v=>r.append(element('td',v)));t.append(r)});panel.append(t,element('h3','Relaciones'));
 const list=element('ul');model.edges.forEach((r,i)=>{if(r[0]!==name&&r[1]!==name)return;const item=element('li');item.append(element('strong','R'+String(i+1).padStart(2,'0')+' · '),element('span',r[0]+' ['+r[3]+'] → '+r[1]+' ['+r[4]+']'),element('br'),element('code',r[2]));list.append(item)});panel.append(list);
}
document.querySelectorAll('.entity').forEach(e=>{e.addEventListener('click',()=>select(e.dataset.entity));e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(e.dataset.entity)}})});
let width=1800;function zoom(delta){width=Math.max(900,Math.min(4200,width+delta));diagram.style.width=width+'px'}
document.getElementById('zoom-in').addEventListener('click',()=>zoom(300));
document.getElementById('zoom-out').addEventListener('click',()=>zoom(-300));
document.getElementById('reset').addEventListener('click',()=>select(null));
select(null);
</script></html>
